# 安装到 Unity 工程后位于 .bulings/workflow.yaml。
# 空字符串和空数组表示未配置：工作流从工程推断，并写入开发说明，不当成硬性规范。

mode: work
model: composer-2.5

docs:
  devSpec:
    enabled: true
    path: Docs/AI/DevSpecs/{feature}.md
  featureDoc:
    enabled: true
    path: Docs/AI/Features/{feature}.md

# Unity MCP：bulings init 会把它合并写入 .cursor/mcp.json（已有同名条目不覆盖）。
# 默认指向本机 HTTP 服务；用 stdio 启动时填 command/args 并清空 url。
unity:
  mcp:
    enabled: true
    server: unity
    url: http://localhost:8080/mcp
    command: ""
    args: []

# AI 知识库：bulings kb --action init 建立；建好后 run 会自动把地图交给 Agent，功能完成后自动维护。
knowledge:
  enabled: true
  root: Docs/AI/Knowledge

# 前端分离：策划案里客户端部分抽出来的文档路径。
clientSplit:
  path: Docs/AI/ClientSpecs/{feature}.md

project:
  codeRoots: []
  namespaces: []
  asmdefs: []
  ui:
    framework: ""
    binding: ""
    notes: ""
  architecture: ""
  style: ""
  protectedPaths: []
