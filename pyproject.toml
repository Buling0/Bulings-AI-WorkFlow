[project]
name = "bulings-ai-workflow"
version = "0.1.0"
description = "个人 Unity 开发工作流"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cursor-sdk",
  "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bulings = "bulings.cli:entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bulings*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
